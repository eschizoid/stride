name: build

# every push, every branch, and every PR
on:
  push:
  pull_request:
  # lets someone start a fresh run by hand, without pushing an empty commit
  workflow_dispatch:

# Keeps one run per ref, so a new push cancels the older run instead of queueing
# behind it. Runs on main are never cancelled, so every merge commit keeps a result.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Type-checks the whole app and runs every pure module's expects on every OS,
  # Windows included. `roc check` and `roc test` stop before native code
  # generation, so they are fast and make a good first gate.
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Roc (new compiler)
        uses: ./.github/actions/setup-roc

      # `roc check` follows every import, so one check covers main.roc and every
      # module it reaches.
      - name: Type-check (main + all modules)
        shell: bash
        run: roc check src/cli/main.roc

      # Checks the payload keys SKILL.md names against the schemas. It reads only
      # source, schemas and Markdown, never the binary, so no build step runs first.
      - name: Check SKILL.md payload shapes against the schemas
        shell: bash
        run: sh tools/skill-shapes.sh

      # Reads source only, so it needs no build. The source gates run on every OS
      # because a shell script can pass on macOS and Linux and fail under Git Bash.
      - name: Check every TEXT decode is CAST to TEXT
        shell: bash
        run: sh tools/blob-safety.sh

      # Reads source only. Every strength adapter must be a row in the ordered table
      # and ship a real sample of its app's text (ADR 0018), and only this gate checks it.
      - name: Check every strength adapter is registered and ships its sample
        shell: bash
        run: sh tools/adapter-fixtures.sh

      # main.roc has no expects, because effectful expects can't run under the test
      # runner, so the type-check above is what covers it.
      - name: Run pure-module tests
        shell: bash
        run: |
          set -euo pipefail
          for m in Fmt Sports; do
            echo "--- roc test src/core/$m.roc (the package both binaries import) ---"
            roc test "src/core/$m.roc"
          done
          # engine modules import the core package, and a bare module run has no
          # package map, so each run names the app with --main
          for m in Metrics Render Drain Csv Command Config Streams Strength; do
            echo "--- roc test --main=src/cli/main.roc src/cli/$m.roc ---"
            roc test --main=src/cli/main.roc "src/cli/$m.roc"
          done
          echo "--- roc check src/cli/Schema.roc (DDL-only, no expects) ---"
          roc check src/cli/Schema.roc

  # Builds the real binary and runs the e2e suites against it with a sandboxed
  # HOME and no network. It runs on macOS only, so the cross-platform gate is
  # check-and-test, which runs on every OS in its matrix.
  e2e:
    needs: check-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Roc (new compiler)
        uses: ./.github/actions/setup-roc
      # sqlite3/jq/awk/curl ship on the macOS runner; just does not
      - name: Install just
        run: brew install just
      - name: Build stride (dev backend — chosen for build time, not correctness)
        run: roc build src/cli/main.roc --output=stride --opt=dev   # new compiler uses --output=
      - name: Run offline e2e suite
        run: ROC=roc just e2e
      # `just e2e-sync` needs no network or credential. Its mocks listen on loopback,
      # STRIDE_API_BASE points stride at them (Config.api_base_allowed permits http to
      # loopback), and the token is a fake row written into a sandboxed HOME.
      - name: Run mock-backed e2e suite
        run: ROC=roc just e2e-sync

  # Checks the docs' command names, the compiler pin and the issue-state claims.
  # They need neither a window nor the e2e harness, and their own job keeps a
  # failing e2e step from skipping them.
  claims:
    needs: check-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Roc (new compiler)
        uses: ./.github/actions/setup-roc
      - name: Install just
        run: |
          # apt-get update fails if any configured source serves bad metadata, and
          # the runner image ships third-party sources that sometimes do. Ubuntu's
          # own sources live in ubuntu.sources, so every other file is deleted.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update -qq || sudo apt-get update -qq
          sudo apt-get install -y -qq just
      - name: Build stride (the command table is the oracle below)
        run: roc build src/cli/main.roc --output=stride --opt=dev
      # Needs no network, so it runs before issue-claims, which reads the tracker and
      # can fail on a GitHub outage. It calls the script and not `just command-claims`,
      # because that recipe rebuilds the binary the step above already built.
      - name: Check the commands the docs name against the command table
        run: sh tools/command-claims.sh
      # Every job takes the setup-roc default, so the compiler tag has one copy.
      # This fails if a workflow overrides it, if the viz app header names a
      # compiler, or if the justfile's viz_pin names a different tag.
      - name: Check the viz roc pin agrees across every workflow site
        run: sh tools/pin-check.sh
      # Fails when a comment or doc says an issue is still open and the tracker says
      # it is closed. GITHUB_TOKEN is enough because the script only reads issue state.
      - name: Check issue-state claims in source comments
        run: just issue-claims
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The app window (src/viz/main.roc) uses the roc-ray platform on the engine's
  # compiler, and nothing in check-and-test imports it. This job checks it through
  # tools/roc-viz.sh, the wrapper that holds the window's assertion-count pins.
  viz-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Roc
        uses: ./.github/actions/setup-roc

      - name: Type-check the app window
        run: sh tools/roc-viz.sh check src/viz/main.roc

      # `just test` names engine modules only, so the window's expects run only
      # through roc-viz.sh, here and in the local viz-test recipe.
      - name: Run the app window's pure expects
        run: sh tools/roc-viz.sh test src/viz/main.roc

  # roc-ray ships an x64glibc host, so the window can link on linux, and a
  # type-check does not prove that. Linking on every PR keeps the release job
  # from being the first place a missing raylib link dependency shows up.
  viz-link-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Roc
        uses: ./.github/actions/setup-roc

      - name: raylib's link dependencies
        run: |
          set -euo pipefail
          # apt-get update fails if any configured source serves bad metadata, and
          # the runner image ships third-party sources that sometimes do. Ubuntu's
          # own sources live in ubuntu.sources, so every other file is deleted.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update -qq || sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxcursor-dev libasound2-dev

      - name: Link the window
        run: |
          set -euo pipefail
          sh tools/roc-viz.sh build src/viz/main.roc --output=stride-viz-linux --opt=dev
          test -s stride-viz-linux
          file stride-viz-linux

  # The window cannot run headless on a runner, so linking it proves the roc-ray
  # x64win host still works. The grep checks that the Windows launcher passes a
  # %USERPROFILE% path as the window's first argument, its read-write grant.
  viz-link-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Roc
        uses: ./.github/actions/setup-roc

      - name: Link the window
        shell: bash
        run: |
          set -euo pipefail
          # rem and # lines are stripped first, so the match must come from the
          # launcher the release writes and not from a comment describing it
          sed -e 's/^ *rem .*//' -e 's/^ *#.*//' .github/workflows/release-please.yml | grep -q 'stride-viz.exe" "%USERPROFILE%'
          sh tools/roc-viz.sh build src/viz/main.roc --output=stride-viz.exe --opt=dev
          test -s stride-viz.exe

  # ADR 0016's gate is plain shell over source text. It needs no toolchain and
  # does not vary by OS, so one small job runs it.
  layer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Layer check (ADR 0016 — imports point down)
        run: bash tools/layer-check.sh
