name: build

# every push, every branch, and every PR
on:
  push:
  pull_request:

jobs:
  # Type-check the whole app + run every pure module's expect suite, on all three
  # OSes INCLUDING Windows. This is the new (Zig) compiler — `roc check` and
  # `roc test` stop before native codegen, so they are fast and deterministic and
  # remain the CI gate. (A full `roc build` of app.roc now WORKS on this nightly —
  # the SpecConstr perf bug roc#10469 was fixed by #10531 — but takes ~6 min and the
  # optimized binary has a rare intermittent SIGABRT (issue #32), so build + e2e are
  # not yet run in CI. Restore them once #32 is resolved.)
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Official cross-platform installer. `nightly-new-compiler` is the only
      # channel that ships a Windows roc binary; pinned to the first nightly that
      # carries the SpecConstr build fix (roc#10531 / commit 94cbed3), so `roc build`
      # works again — and `roc check`/`roc test` stay deterministic on it.
      - name: Install Roc (new compiler)
        uses: roc-lang/setup-roc@v0.3.0
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-August-03-94cbed3

      # One check covers the whole codebase: `roc check` follows every import, so
      # this type-checks app.roc plus all 8 modules against basic-cli 0.21 + http.
      - name: Type-check (app + all modules)
        shell: bash
        run: roc check src/app.roc

      # The pure modules carry the logic and the tests (160 expects total). app.roc
      # has no expects (its effectful ones can't run under the test runner), so it
      # is validated by `check` above.
      - name: Run pure-module tests
        shell: bash
        run: |
          set -euo pipefail
          for m in Config Command Csv Backfill Metrics Render Streams; do
            echo "--- roc test src/$m.roc ---"
            roc test "src/$m.roc"
          done
          echo "--- roc check src/Schema.roc (DDL-only, no expects) ---"
          roc check src/Schema.roc

  # COVERAGE GAP (intentional, tracked): the e2e needs a compiled `stride` binary.
  # `roc build` now works on this nightly (~6 min), and the native e2e harness
  # (tests/e2e.roc) builds in seconds — but the optimized binary has a rare
  # intermittent SIGABRT (issue #32) that lands at random spots across the ~140-check
  # suite, making it flaky, so build + e2e are held out of CI. `check` + pure-module
  # `test` above are the gate meanwhile. RESTORE this job (build app.roc, then run
  # the native `just e2e` offline suite + `just e2e-sync`) once #32 is resolved.
  #
  # e2e:
  #   needs: check-and-test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: roc-lang/setup-roc@v0.3.0
  #       with: { version: nightly-new-compiler, nightly-tag: nightly-2026-August-03-94cbed3 }
  #     - run: roc build src/app.roc --output=stride   # ~6 min; new compiler uses --output=
  #     - run: ROC_NEW=roc just e2e
