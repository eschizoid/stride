name: build

# every push, every branch, and every PR
on:
  push:
  pull_request:
  # lets a run be retriggered without an empty commit — during the 2026-08-06 Actions
  # outage the only way to get a fresh run was to resurrect a dead one, which is
  # unreliable for runs that ended `cancelled`
  workflow_dispatch:

# One run per ref. A second push supersedes the first instead of queueing behind it:
# without this, four runs stacked up on two branches during an Actions outage and every
# one of them still had to be scheduled before the newest could start. `main` is exempt —
# cancelling a merge-commit build would leave the default branch with no result.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Type-check the whole app + run every pure module's expect suite, on all three
  # OSes INCLUDING Windows. This is the new (Zig) compiler — both `roc check` and
  # `roc test` stop before native codegen, so they are fast and deterministic and
  # make a good first gate. (The `e2e` job below does build the real binary, with
  # --opt=dev; only the OPTIMIZED --opt=speed backend stays gated on the intermittent
  # SIGABRT in issue #32.)
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Official cross-platform installer. `nightly-new-compiler` is the only
      # channel that ships a Windows roc binary; pinned to the first nightly that
      # carries the SpecConstr build fix (roc#10531 / commit 94cbed3), so `roc build`
      # works again — and `roc check`/`roc test` stay deterministic on it.
      # The nightlies host intermittently serves a bad cert chain: four runs in one
      # day died on `curl: (60)` here, on all three runners, before compiling a
      # line. A manual re-run always succeeded immediately, so the failure is
      # transient and one retry absorbs it. Caching the toolchain instead would
      # also work, but setup-roc owns the extraction layout and it differs per
      # OS — guessing at those paths trades a known flake for an unknown one.
      - name: Install Roc (new compiler)
        id: roc
        uses: roc-lang/setup-roc@v0.3.0
        continue-on-error: true
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-August-04-1cb06bc
      - name: Install Roc (retry — the first attempt hit a transient download failure)
        if: ${{ steps.roc.outcome == 'failure' }}
        uses: roc-lang/setup-roc@v0.3.0
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-August-04-1cb06bc

      # One check covers the whole codebase: `roc check` follows every import, so
      # this type-checks app.roc plus all 8 modules against basic-cli 0.21 + http.
      - name: Type-check (app + all modules)
        shell: bash
        run: roc check src/app.roc

      # The pure modules carry the logic and the tests (160 expects total). app.roc
      # has no expects (its effectful ones can't run under the test runner), so it
      # is validated by `check` above.
      - name: Run pure-module tests
        shell: bash
        run: |
          set -euo pipefail
          for m in Config Command Csv Backfill Metrics Render Streams; do
            echo "--- roc test src/$m.roc ---"
            roc test "src/$m.roc"
          done
          echo "--- roc check src/Schema.roc (DDL-only, no expects) ---"
          roc check src/Schema.roc

  # End-to-end: build the real binary and run the native offline e2e suite (157 checks,
  # sandboxed HOME, no network). Built with --opt=dev: the optimized (--opt=speed) backend
  # has an intermittent SIGABRT on the stream-decode path (issue #32), so RELEASE binaries
  # stay gated on it — but --opt=dev is stable and the suite passes deterministically.
  #
  # Runs on macOS, NOT linux: the compiler has a memory-layout-dependent codegen bug (a
  # constant "" used in a str op corrupts the heap — reported upstream) that manifests on
  # the linux build even where the macOS build is clean, so the linux e2e crashes at spots
  # the macOS one doesn't. macOS is the dev platform and the suite is green there; the
  # cross-platform gate is `check` + pure `test` above (all three OSes). Move e2e back to
  # linux once the upstream codegen bug is fixed. e2e-sync (network) is still local-only.
  e2e:
    needs: check-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Roc (new compiler)
        id: roc
        uses: roc-lang/setup-roc@v0.3.0
        continue-on-error: true
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-August-04-1cb06bc
      - name: Install Roc (retry — the first attempt hit a transient download failure)
        if: ${{ steps.roc.outcome == 'failure' }}
        uses: roc-lang/setup-roc@v0.3.0
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-August-04-1cb06bc
      # sqlite3/jq/awk/curl ship on the macOS runner; just does not
      - name: Install just
        run: brew install just
      - name: Build stride (dev backend — #32 blocks the optimized one)
        run: roc build src/app.roc --output=stride --opt=dev   # ~6 min; new compiler uses --output=
      - name: Run offline e2e suite (157 checks)
        run: ROC=roc just e2e
