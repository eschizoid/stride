name: build

# every push, every branch — no PR dance
on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Install roc (alpha4-rolling, checksum-pinned)
        run: |
          set -euo pipefail
          # alpha4-rolling is a MOVING tag. Local dev pins the 2025-09-09 build;
          # this checksum makes CI FAIL LOUDLY if the tag ever changes under us,
          # instead of silently testing a different compiler than we develop on.
          EXPECTED=96e8be05e6f7176433ada74532ff36a62b8dc44c5247a82cdf919f2dadc5178b
          curl -sL -o roc.tar.gz https://github.com/roc-lang/roc/releases/download/alpha4-rolling/roc-linux_x86_64-alpha4-rolling.tar.gz
          echo "${EXPECTED}  roc.tar.gz" | sha256sum -c -
          tar xzf roc.tar.gz
          roc_dir=$(ls -d roc_nightly*)
          echo "$PWD/${roc_dir}" >> "$GITHUB_PATH"

      # same entry point as local dev — the justfile owns the pipeline
      - name: Test
        run: just test
        env:
          ROC: roc
          STRIDE_LINKER: --linker=legacy  # surgical linker hits roc issue #3609 on linux
