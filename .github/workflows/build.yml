name: build

# every push, every branch, and every PR
on:
  push:
  pull_request:
  # lets someone start a fresh run by hand, without pushing an empty commit
  workflow_dispatch:

# Keeps one run per ref, so a new push cancels the older run instead of queueing
# behind it. On main a run in progress is never cancelled: a newer push waits
# behind it, and replaces any run that is still waiting.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Type-checks the whole app and runs every pure module's expects on every OS,
  # Windows included. `roc check` and `roc test` stop before native code
  # generation, so they are fast and make a good first gate.
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Roc (new compiler)
        uses: ./.github/actions/setup-roc

      # `roc check` follows every import, so one check covers main.roc and every
      # module it reaches.
      - name: Type-check (main + all modules)
        shell: bash
        run: roc check src/cli/main.roc

      # The three source gates below read only source, schemas and Markdown, never
      # the binary, so no build runs first. They run on every OS because a shell
      # script can pass on macOS and Linux and fail under Git Bash.
      - name: Check SKILL.md payload shapes against the schemas
        shell: bash
        run: sh tools/skill-shapes.sh

      - name: Check every TEXT decode is CAST to TEXT
        shell: bash
        run: sh tools/blob-safety.sh

      # Every strength adapter must be a row in the ordered table and ship a real
      # sample of its app's text (ADR 0018), and only this gate checks it.
      - name: Check every strength adapter is registered and ships its sample
        shell: bash
        run: sh tools/adapter-fixtures.sh

      # main.roc has no expects, because effectful expects can't run under the test
      # runner, so the type-check above is what covers it.
      - name: Run pure-module tests
        shell: bash
        run: |
          set -euo pipefail
          for m in Fmt Sports; do
            echo "--- roc test src/core/$m.roc (the package both binaries import) ---"
            roc test "src/core/$m.roc"
          done
          # a module that imports a package resolves only through an app, so each
          # run names it with --main, which runs every expect the app reaches
          for m in Metrics Render Drain Csv Command Config Streams Strength; do
            echo "--- roc test --main=src/cli/main.roc src/cli/$m.roc ---"
            roc test --main=src/cli/main.roc "src/cli/$m.roc"
          done
          echo "--- roc check src/cli/Schema.roc (DDL-only, no expects) ---"
          roc check src/cli/Schema.roc

  # Every .roc file must already be in `roc fmt` form. The formatter reads only
  # source, so one OS is enough; Linux, whose checkout keeps the files byte for
  # byte as committed.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Roc (new compiler)
        uses: ./.github/actions/setup-roc

      - name: Check formatting (roc fmt --check)
        shell: bash
        run: roc fmt --check src tests

  # Builds the real binary and runs the e2e suites against it with a sandboxed
  # HOME and no network. It runs on macOS, where the suite is known green; no
  # known bug pins it there, so moving it needs a trial run. On Windows the
  # engine's tests are check-and-test's type-check and expects; viz-link-windows
  # builds it natively to package it with the window, and runs only its
  # --version there.
  e2e:
    needs: check-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # sips is macOS's: every icon and the splash's mark must be the master's
      # (img/stride-icon.png) by its transform in img/make-icons.sh, with no
      # light fringe at its edge
      - name: The committed icons and splash mark are their master's by their transforms
        run: sh img/make-icons.sh --check
      - name: Install Roc (new compiler)
        uses: ./.github/actions/setup-roc
      # sqlite3/jq/awk/curl ship on the macOS runner; just does not
      - name: Install just
        run: brew install just
      - name: Build stride (dev backend — chosen for build time, not correctness)
        run: roc build src/cli/main.roc --output=stride --opt=dev   # new compiler uses --output=
      - name: Run offline e2e suite
        run: ROC=roc just e2e
      # CI's only check of sync's payload, stream drain included, against
      # schemas/v3/sync.json. It needs no network or credential: its mocks listen on
      # loopback, STRIDE_API_BASE points stride at them (Config.api_base_allowed
      # permits http to loopback), and the token is a fake row in a sandboxed HOME.
      - name: Run mock-backed e2e suite
        run: ROC=roc just e2e-sync

  # Checks the docs' command names, the compiler pin and the issue-state claims.
  # They need neither a window nor the e2e harness, and their own job keeps a
  # failing e2e step from skipping them.
  claims:
    needs: check-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Roc (new compiler)
        uses: ./.github/actions/setup-roc
      - name: Install just
        run: |
          # apt-get update fails if any configured source serves bad metadata, and
          # the runner image ships third-party sources that sometimes do. Ubuntu's
          # own sources live in ubuntu.sources, so every other file is deleted.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update -qq || sudo apt-get update -qq
          sudo apt-get install -y -qq just
      - name: Build stride (the command table is the oracle below)
        run: roc build src/cli/main.roc --output=stride --opt=dev
      # Needs no network, so it runs before issue-claims, which reads the tracker and
      # can fail on a GitHub outage. It calls the script and not `just command-claims`,
      # because that recipe rebuilds the binary the step above already built.
      - name: Check the commands the docs name against the command table
        run: sh tools/command-claims.sh
      # Every job takes the setup-roc default, so no workflow holds a copy of the
      # compiler tag. This fails if a workflow overrides it, if the viz app header
      # names a compiler, or if the justfile's viz_pin, the one other copy a build
      # reads, differs.
      - name: Check the viz roc pin agrees across every workflow site
        run: sh tools/pin-check.sh
      # Fails when a comment or doc says an issue is still open and the tracker says
      # it is closed. GITHUB_TOKEN is enough because the script only reads issue state.
      - name: Check issue-state claims in source comments
        run: just issue-claims
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The app window (src/viz/main.roc) uses the roc-ray platform on the engine's
  # compiler, and nothing in check-and-test imports it. This job checks it through
  # tools/roc-viz.sh, the wrapper that holds the window's assertion-count pins.
  viz-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Roc
        uses: ./.github/actions/setup-roc

      - name: Type-check the app window
        run: sh tools/roc-viz.sh check src/viz/main.roc

      # `just test` names engine modules only, so the window's expects run only
      # through roc-viz.sh, here and in the local viz-test recipe.
      - name: Run the app window's pure expects
        run: sh tools/roc-viz.sh test src/viz/main.roc
  # roc-ray's linux host is x64glibc, so the window can link on linux, and a
  # type-check does not prove that. Linking on every PR keeps the release job
  # from being the first place a missing raylib link dependency shows up, and
  # packaging the linked binary with the release's own script keeps it from
  # being the first place the tarball or its launcher is exercised. The
  # packaged launcher then starts the window under Xvfb, rendered in software
  # by Mesa's llvmpipe, and the window must come up, land its boot load and
  # capture the form board through its own bus. The command is built beside
  # it, packaged with it, and both are installed by install.sh over the
  # latest release. Nothing is uploaded.
  viz-link-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Roc
        uses: ./.github/actions/setup-roc

      # the X server, Mesa's software drivers and sqlite3 serve the start
      # proof below
      - name: raylib's link dependencies, and a virtual display
        run: |
          set -euo pipefail
          # apt-get update fails if any configured source serves bad metadata, and
          # the runner image ships third-party sources that sometimes do. Ubuntu's
          # own sources live in ubuntu.sources, so every other file is deleted.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update -qq || sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxcursor-dev libasound2-dev \
            xvfb xauth libgl1-mesa-dri sqlite3

      - name: Link the window
        run: |
          set -euo pipefail
          sh tools/roc-viz.sh build src/viz/main.roc --output=stride-viz-linux --opt=dev
          test -s stride-viz-linux
          file stride-viz-linux

      - name: Build the command the package carries
        run: roc build src/cli/main.roc --output=stride-cli-linux-x86_64 --opt=dev

      # headless: the host draws nothing and needs no display
      - name: Drive the window through its bus, headless
        run: sh tools/viz-bus.sh ./stride-cli-linux-x86_64 ./stride-viz-linux

      - name: Package it as the release does
        run: bash tools/package-viz.sh linux package stride-viz-linux stride-cli-linux-x86_64

      - name: Prove the launcher seeds a fresh home
        run: bash tools/package-viz.sh linux prove

      # LIBGL_ALWAYS_SOFTWARE keeps Mesa on llvmpipe; the screen is larger
      # than the window's default size, so the capture is the whole board
      - name: Start the packaged window under a virtual display
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s '-screen 0 1920x1080x24' bash tools/package-viz.sh linux start

      - name: Install this checkout's command and app over the latest release with install.sh
        run: |
          set -euo pipefail
          mkdir -p dist
          cp stride-cli-linux-x86_64 stride-app-linux-x86_64.tar.gz dist/
          bash tools/install-check.sh local dist

  # The window cannot be looked at on a runner, so CI links it, which proves the
  # roc-ray x64win host still works, then packages it with the release's own
  # script and runs the launcher against a fake home. The grep checks that the
  # launcher passes a %USERPROFILE% path as the window's first argument, its
  # read-write grant, which seeding alone does not show. The command is built
  # beside it, packaged with it, and both are installed by install.ps1 over the
  # latest release, under Windows PowerShell and PowerShell 7. Nothing is
  # uploaded.
  viz-link-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Roc
        uses: ./.github/actions/setup-roc

      - name: Link the window
        shell: bash
        run: |
          set -euo pipefail
          # rem and # lines are stripped first, so the match must come from the
          # launcher the script writes and not from a comment describing it
          launcher=$(sed -e 's/^ *rem .*//' -e 's/^ *#.*//' tools/package-viz.sh)
          grep -q 'stride-viz.exe" "%USERPROFILE%' <<<"$launcher" || { echo "::error::the windows launcher does not pass %USERPROFILE% first"; exit 1; }
          sh tools/roc-viz.sh build src/viz/main.roc --output=stride-viz.exe --opt=dev
          test -s stride-viz.exe

      - name: Build the command the package carries
        shell: bash
        run: roc build src/cli/main.roc --output=stride-cli-windows-x86_64.exe --opt=dev

      - name: Package it as the release does
        shell: bash
        run: bash tools/package-viz.sh windows package stride-viz.exe stride-cli-windows-x86_64.exe

      - name: Prove the launcher seeds a fresh home
        shell: bash
        run: bash tools/package-viz.sh windows prove

      - name: Gather this checkout's command and app as a release folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp stride-cli-windows-x86_64.exe stride-app-windows-x86_64.zip dist/

      - name: Install them over the latest release with install.ps1 (Windows PowerShell)
        shell: powershell
        run: ./tools/install-check.ps1 local dist powershell

      - name: Install them over the latest release with install.ps1 (PowerShell 7)
        shell: pwsh
        run: ./tools/install-check.ps1 local dist pwsh

  # The macOS app as the release builds it, on every pull request: the
  # bundle with the command built beside it, verified and proved by the
  # release's own checks, then zipped as the release zips it and installed
  # by install.sh over the latest release. The hosted macOS runner has no
  # OpenGL context, so the window is not started here; that is verified on
  # a real machine. Nothing is uploaded.
  viz-app-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Roc
        uses: ./.github/actions/setup-roc

      - name: Build the command and the bundle that carries it
        run: |
          set -euo pipefail
          roc build src/cli/main.roc --output=stride-cli-macos-arm64 --opt=dev
          VIZ_APP_DIR="$PWD/stage" STRIDE_CLI="$PWD/stride-cli-macos-arm64" bash tools/make-viz-app.sh

      - name: Verify and prove the bundle as the release does
        run: |
          set -euo pipefail
          bash tools/package-viz.sh macos verify stage/Stride.app stride-cli-macos-arm64
          bash tools/package-viz.sh macos prove stage/Stride.app

      - name: Install this checkout's command and app over the latest release with install.sh
        run: |
          set -euo pipefail
          mkdir -p dist
          cp stride-cli-macos-arm64 dist/
          (cd stage && ditto -c -k --sequesterRsrc --keepParent Stride.app ../dist/stride-app-macos-arm64.zip)
          bash tools/install-check.sh local dist

  # ADR 0016's gate is plain shell over source text and needs no toolchain, so
  # one small job runs it, on linux only.
  layer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Layer check (ADR 0016 — imports point down)
        run: bash tools/layer-check.sh

  # The one-line installers, run against the published releases on every
  # platform they serve: tools/install-check.sh (install.sh, macOS and linux)
  # and tools/install-check.ps1 (install.ps1, Windows PowerShell and
  # PowerShell 7) cut each installer off at every line and check nothing
  # installs, install the latest release and check the command starts, then
  # install an older release with the app and the latest over it and check
  # the update in place: the newer command and app, the athlete's directory
  # kept, and no quarantine attribute or Mark of the Web on what they
  # installed. On Windows the static check first parses install.ps1 cut after
  # every byte and runs its functions on local files, under both shells. They
  # read the releases, not this branch's build, so they also catch a release
  # whose asset names or SHA256SUMS.txt drifted from what the installers
  # expect; the viz jobs install this branch's packages.
  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: install.sh installs, updates in place, and installs nothing when cut off
        if: runner.os != 'Windows'
        run: bash tools/install-check.sh release v0.22.0

      - name: install.ps1 runs nothing when cut off, and its functions refuse a bad download (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/install-check.ps1 static

      - name: install.ps1 runs nothing when cut off, and its functions refuse a bad download (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install-check.ps1 static

      - name: install.ps1 installs, updates in place, and installs nothing when cut off (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/install-check.ps1 release v0.22.0 powershell

      - name: install.ps1 installs, updates in place, and installs nothing when cut off (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install-check.ps1 release v0.22.0 pwsh
