name: build

# every push, every branch, and every PR
on:
  push:
  pull_request:
  # lets a run be retriggered without an empty commit — during the 2026-08-06 Actions
  # outage the only way to get a fresh run was to resurrect a dead one, which is
  # unreliable for runs that ended `cancelled`
  workflow_dispatch:

# One run per ref. A second push supersedes the first instead of queueing behind it:
# without this, four runs stacked up on two branches during an Actions outage and every
# one of them still had to be scheduled before the newest could start. `main` is exempt —
# cancelling a merge-commit build would leave the default branch with no result.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Type-check the whole app + run every pure module's expect suite, on all three
  # OSes INCLUDING Windows. This is the new (Zig) compiler — both `roc check` and
  # `roc test` stop before native codegen, so they are fast and deterministic and
  # make a good first gate. (The `e2e` job below does build the real binary, with
  # --opt=dev, which is now a BUILD-TIME choice: #32's SIGABRT was fixed by the
  # 2026-08-17 compiler pin, and --opt=speed costs ~2min against ~14s.)
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Official cross-platform installer. `nightly-new-compiler` is the only
      # channel that ships a Windows roc binary. The current tag is pinned because it
      # clears the compiler segfault that some nightlies after 08-04 introduced -- the pin
      # is itself later than that and is green, so the bound is not simply a date (see
      # docs/roc-new-compiler-notes.md); the SpecConstr build fix (roc#10531) that
      # motivated the PREVIOUS pin is long since carried by every nightly in range.
      # The nightlies host intermittently serves a bad cert chain: four runs in one
      # day died on `curl: (60)` here, on all three runners, before compiling a
      # line. A manual re-run always succeeded immediately, so the failure is
      # transient and one retry absorbs it. Caching the toolchain instead would
      # also work, but setup-roc owns the extraction layout and it differs per
      # OS — guessing at those paths trades a known flake for an unknown one.
      - name: Install Roc (new compiler)
        id: roc
        uses: roc-lang/setup-roc@v0.3.0
        continue-on-error: true
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-08-23-fb208ba
      - name: Install Roc (retry — the first attempt hit a transient download failure)
        if: ${{ steps.roc.outcome == 'failure' }}
        uses: roc-lang/setup-roc@v0.3.0
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-08-23-fb208ba

      # One check covers the whole codebase: `roc check` follows every import, so
      # this type-checks app.roc plus all 16 modules against basic-cli 0.22 + http.
      - name: Type-check (app + all modules)
        shell: bash
        run: roc check src/app.roc

      # Here rather than in the `e2e` job, and rather than only in the justfile.
      #
      # Only-in-the-justfile was the first cut, and it does not change anything: a recipe a
      # human must remember to type is how the two drifts this guards were found in the
      # first place, which was a person reading a diff. `command-claims` resolves command
      # NAMES; this resolves payload KEYS.
      #
      # And in THIS job because it reads source, schemas and Markdown — never the binary,
      # never a database. `command-claims` sits in `e2e` because its oracle genuinely is
      # the built binary; this one's is not, so putting it there means a compiler flake or
      # an unrelated e2e failure stops a docs check from ever running.
      - name: Check SKILL.md payload shapes against the schemas
        shell: bash
        run: sh tools/skill-shapes.sh

      # Same job and the same reason: reads source only, so it must not sit behind a build.
      # It also belongs on every OS — the SKILL.md gate was green on macOS and Linux while
      # broken on Windows three separate ways, and only the matrix ever showed it.
      - name: Check every TEXT decode is CAST to TEXT
        shell: bash
        run: sh tools/blob-safety.sh

      # The pure modules carry the logic and the tests. app.roc
      # has no expects (its effectful ones can't run under the test runner), so it
      # is validated by `check` above.
      - name: Run pure-module tests
        shell: bash
        run: |
          set -euo pipefail
          for m in Config Command Csv Drain Metrics Render Sports Streams; do
            echo "--- roc test src/$m.roc ---"
            roc test "src/$m.roc"
          done
          echo "--- roc check src/Schema.roc (DDL-only, no expects) ---"
          roc check src/Schema.roc

  # End-to-end: build the real binary and run the native offline e2e suite (
  # sandboxed HOME, no network). Built with --opt=dev for build time; #32's SIGABRT in the
  # optimized backend was fixed by the 2026-08-17 pin, so RELEASE binaries
  # are built with it too — the suite passes deterministically either way.
  #
  # Runs on macOS, NOT linux. The original reason was a memory-layout-dependent codegen
  # bug (a constant "" in a str op corrupting the heap) that hit the linux build even
  # where macOS was clean. That bug is roc#10595, fixed upstream on 2026-08-04, and the
  # current pin carries the fix — so the reason is spent and the placement is now just
  # untested. macOS is the dev platform and the suite is green there; the cross-platform
  # gate is `check` + pure `test` above (all three OSes). Moving e2e to linux now needs a
  # trial run, not a comment change. e2e-sync also runs here now — it needs no network.
  e2e:
    needs: check-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Roc (new compiler)
        id: roc
        uses: roc-lang/setup-roc@v0.3.0
        continue-on-error: true
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-08-23-fb208ba
      - name: Install Roc (retry — the first attempt hit a transient download failure)
        if: ${{ steps.roc.outcome == 'failure' }}
        uses: roc-lang/setup-roc@v0.3.0
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-08-23-fb208ba
      # sqlite3/jq/awk/curl ship on the macOS runner; just does not
      - name: Install just
        run: brew install just
      - name: Build stride (dev backend — chosen for build time, not correctness)
        run: roc build src/app.roc --output=stride --opt=dev   # new compiler uses --output=
      - name: Run offline e2e suite
        run: ROC=roc just e2e
      # Runs in CI despite the "sync" name: it needs no network and no credential.
      # The mocks bind loopback, STRIDE_API_BASE points stride at them (Config
      # .api_base_allowed permits http to loopback for exactly this), and the token is a
      # fake row written into a sandboxed HOME. This was left out on the belief that it
      # "needs a token and a live API" — it does not, and that belief cost the stream drain
      # its only payload-vs-schema check in CI.
      - name: Run mock-backed e2e suite
        run: ROC=roc just e2e-sync
      # Deterministic and network-free, so it runs BEFORE issue-claims: that one needs the
      # tracker, and a GitHub outage there would otherwise mean this check — which can
      # always run — never does.
      #
      # The oracle is the binary's own command table, which this job built two steps up.
      # The SCRIPT, not `just command-claims`, and the difference is not cosmetic: the
      # recipe depends on `build` for local use, `just` has no up-to-date check, and
      # `roc build` is 16 of the recipe's 18 seconds — so through the recipe this step
      # recompiles the binary "Build stride" already produced, and a compiler flake turns a
      # DOCS check red under a message about docs. The rebuild bought nothing here: the
      # script exits 6 naming the missing binary, and the job cannot reach this step without
      # a successful build anyway.
      - name: Check the commands the docs name against the command table
        run: sh tools/command-claims.sh
      # Cheap, and it guards a class that has rotted twice: a comment asserting an issue
      # is still open when the tracker says closed (#165 found `#105 remains open` sitting
      # 560 lines above the same file saying it was fixed). GITHUB_TOKEN is enough — it
      # only reads issue state.
      - name: Check issue-state claims in source comments
        run: just issue-claims
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
