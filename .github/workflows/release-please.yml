name: release-please

# Automated releases. release-please watches Conventional Commits on main
# (feat:/fix:/…), maintains CHANGELOG.md and the version in main.roc, and opens a
# "release PR". Merging that PR tags vX.Y.Z + creates the GitHub release.
#
# NOTE: binary build/upload jobs are ENABLED on the new (Zig) compiler, pinned nightly,
# --opt=dev (chosen for build time; #32's SIGABRT was fixed by the 2026-08-17 pin). All FIVE
# targets build with fail-fast
# off + upload runs with always(), so a partial binary set attaches even if a target fails.
# Historical caveat, resolved: bug C (sync heap corruption, #105) was a basic-cli host
# double-free, fixed in 0.22.0. "Bug B" (linux Json.to_str) is named only in these
# comments and has no issue behind it; roc-json was dropped for builtin JSON, so the
# label no longer refers to anything. Neither gates this workflow.
on:
  push:
    branches: [main]

permissions:
  contents: write # tags, releases, and the version-bump commit
  pull-requests: write # the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ github.token }}

  build:
    name: build ${{ matrix.target }}
    needs: release-please
    # ENABLED on the new (Zig) compiler at the pinned nightly (bug A fixed),
    # --opt=dev (build time, not correctness — #32 fixed on the 2026-08-17 pin). All five targets, fail-fast off — we want to SEE which
    # platforms build + pass version-check in CI. The bugs this used to hedge against
    # (C: sync heap corruption, #105; B: linux Json.to_str) are gone -- see the header.
    # The version check only runs `--version` (no sync/plan), so a target failing here
    # means the BUILD itself broke (e.g. linux codegen/linker).
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash # git-bash on Windows so the `set -euo pipefail` steps run on every runner
    strategy:
      fail-fast: false # one target failing shouldn't sink the others
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-latest
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            # VERIFIED 2026-08-14 via the dispatch-only verify-arm64 workflow (run
            # 31832832308): this exact flag on this runner class builds a binary that
            # runs and initializes its SQLite db. History: without the explicit target
            # the compiler auto-detects arm64v1musl, which resolves to no usable host,
            # and releases shipped without linux-arm64 (#141). v0.4.0 onward ship all five.
            roc_target: arm64musl
          - target: macos-arm64
            runs-on: macos-latest # Apple Silicon
          - target: macos-x86_64
            runs-on: macos-15-intel # current Intel runner, standard tier (free for public)
          - target: windows-x86_64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }} # the tagged commit

      - name: Install Roc (new compiler)
        uses: ./.github/actions/setup-roc

      - name: Build
        run: |
          set -euo pipefail
          # only linux-arm64 sets roc_target; everywhere else the native default is right
          target_flag=""
          if [ -n "${{ matrix.roc_target }}" ]; then target_flag="--target=${{ matrix.roc_target }}"; fi
          roc build src/main.roc --output="stride-cli-${{ matrix.target }}" --opt=dev $target_flag
          ls -la stride-cli-${{ matrix.target }}* || true
          test -f "stride-cli-${{ matrix.target }}" || test -f "stride-cli-${{ matrix.target }}.exe"

      - name: Verify binary version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          bin="stride-cli-${{ matrix.target }}"; [ -f "$bin" ] || bin="${bin}.exe"
          out=$(./"$bin" --version)
          [ "$out" = "stride ${TAG#v}" ] || { echo "::error::binary says '$out', tag is $TAG"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: stride-cli-${{ matrix.target }}
          path: stride-cli-${{ matrix.target }}*
          if-no-files-found: error

  build-viz:
    name: build the app (${{ matrix.target }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.runs-on }}
    # upload waits on these; the 360-minute default would hold a release's
    # assets for six hours
    timeout-minutes: 25
    # macOS only: linux needs a verified recipe for raylib's X11/GL link deps
    strategy:
      fail-fast: false # one arch failing shouldn't cost the other
      matrix:
        include:
          - target: macos-arm64
            runs-on: macos-latest
          - target: macos-x86_64
            runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Roc (the viz pin, not the engine pin)
        uses: ./.github/actions/setup-roc
        with:
          nightly-tag: nightly-2026-08-23-fb208ba

      - name: Build the .app bundle
        run: |
          set -euo pipefail
          VIZ_APP_DIR="$PWD/stage" bash tools/make-viz-app.sh

      - name: Verify the bundle before it ships
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          app="stage/Stride.app"
          bin="$app/Contents/MacOS/stride-viz"
          # launcher is CFBundleExecutable
          test -x "$app/Contents/MacOS/launcher"
          test -s "$bin" && test -x "$bin"
          # the zip's name is all a downloader has to go on
          case "${{ matrix.target }}" in
            macos-arm64)  want=arm64 ;;
            macos-x86_64) want=x86_64 ;;
          esac
          got=$(lipo -archs "$bin")
          [ "$got" = "$want" ] || { echo "::error::${{ matrix.target }} bundle is $got, not $want"; exit 1; }
          # --verify, not -dv: -dv only displays, and exits 0 on a signature
          # that has been modified - the case Apple Silicon kills at launch
          codesign --verify --strict "$bin" || { echo "::error::${{ matrix.target }} signature is missing or invalid"; exit 1; }
          # every face the window loads, non-empty, and none dropped
          for f in Quicksand-Medium.ttf JetBrainsMono-Regular.ttf; do
            test -s "$app/Contents/Resources/fonts/$f"
          done
          have=$(ls "$app/Contents/Resources/fonts/"*.ttf | wc -l | tr -d ' ')
          want_n=$(ls assets/fonts/*.ttf | wc -l | tr -d ' ')
          [ "$have" = "$want_n" ] || { echo "::error::bundled $have fonts, assets/fonts has $want_n"; exit 1; }
          # the script falls back to 0.0.0-dev if the version marker moves;
          # the CLI gates its --version against the tag, so the app gates too
          got_v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          [ "$got_v" = "${TAG#v}" ] || { echo "::error::bundle says $got_v, tag is $TAG"; exit 1; }

      - name: Prove the launcher seeds a fresh machine
        run: |
          set -euo pipefail
          # the launcher cds to $HOME, so seeding ~/.stride/fonts is the
          # bundle's only route to the window
          fake="$(mktemp -d)"
          HOME="$fake" "stage/Stride.app/Contents/MacOS/launcher" >/dev/null 2>&1 &
          pid=$!
          sleep 3
          kill $pid 2>/dev/null || true
          for f in Quicksand-Medium.ttf JetBrainsMono-Regular.ttf; do
            test -s "$fake/.stride/fonts/$f" || { echo "::error::launcher did not seed $f"; exit 1; }
          done
          # a short/corrupt copy must be repaired, not skipped forever
          printf 'x' > "$fake/.stride/fonts/Quicksand-Medium.ttf"
          HOME="$fake" "stage/Stride.app/Contents/MacOS/launcher" >/dev/null 2>&1 &
          pid=$!
          sleep 3
          kill $pid 2>/dev/null || true
          [ "$(wc -c < "$fake/.stride/fonts/Quicksand-Medium.ttf")" -gt 1000 ] || { echo "::error::a corrupt font was not repaired"; exit 1; }
          rm -rf "$fake"

      - name: Zip it
        run: |
          set -euo pipefail
          cd stage
          # ditto is Apple's archiver: the bundle round-trips exactly as
          # Finder's own Compress would produce it
          ditto -c -k --sequesterRsrc --keepParent "Stride.app" \
            "../stride-app-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: stride-app-${{ matrix.target }}
          path: stride-app-${{ matrix.target }}.zip
          if-no-files-found: error

  build-viz-linux:
    name: build the app (linux-x86_64)
    needs: release-please
    # roc-ray ships an x64glibc host only, so linux-arm64 has no app. There is
    # no bundle format here: the tarball carries the binary, the brand fonts
    # and a launcher that seeds ~/.stride/fonts, which is what the window reads.
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Roc (the viz pin, not the engine pin)
        uses: ./.github/actions/setup-roc
        with:
          nightly-tag: nightly-2026-08-23-fb208ba

      - name: raylib's link dependencies
        run: |
          set -euo pipefail
          # apt-get update fails if ANY configured source serves bad metadata,
          # and the runner image ships third-party repos (Chrome et al) that
          # do exactly that intermittently. Ubuntu's own sources live in
          # ubuntu.sources on current runner images; everything else goes
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update -qq || sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxcursor-dev libasound2-dev

      - name: Build and package
        run: |
          set -euo pipefail
          mkdir -p stage/stride-app/fonts
          roc build src/viz/main.roc --output=stage/stride-app/stride-viz --opt=dev
          cp assets/fonts/*.ttf assets/fonts/OFL-*.txt stage/stride-app/fonts/
          cat > stage/stride-app/stride-app <<'SH'
          #!/bin/sh
          # a desktop launch inherits a minimal PATH, and the window shells out
          # to `stride` for the CP fit
          PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          export PATH
          # the window reads ~/.stride/fonts; seed it from the copies shipped
          # beside this script, replacing any that differ in size
          here="$(cd "$(dirname "$0")" && pwd)"
          log="$HOME/.stride/fonts-seed.log"
          if [ -d "$here/fonts" ]; then
            if mkdir -p "$HOME/.stride/fonts" 2>/dev/null; then
              for f in "$here"/fonts/*.ttf; do
                [ -e "$f" ] || continue
                dst="$HOME/.stride/fonts/$(basename "$f")"
                if [ ! -e "$dst" ] || [ "$(wc -c < "$f")" != "$(wc -c < "$dst")" ]; then
                  cp "$f" "$dst" 2>>"$log" || echo "$(date): could not write $dst" >> "$log"
                fi
              done
            else
              echo "$(date): could not create $HOME/.stride/fonts - the window will use its fallback font" >> "$log" 2>/dev/null || true
            fi
          fi
          cd "$HOME"
          exec "$here/stride-viz"
          SH
          chmod +x stage/stride-app/stride-app stage/stride-app/stride-viz
          test -s stage/stride-app/stride-viz
          for f in Quicksand-Medium.ttf JetBrainsMono-Regular.ttf; do
            test -s "stage/stride-app/fonts/$f"
          done
          tar -C stage -czf "stride-app-linux-x86_64.tar.gz" stride-app

      - name: Prove the launcher seeds a fresh home
        run: |
          set -euo pipefail
          fake="$(mktemp -d)"
          HOME="$fake" ./stage/stride-app/stride-app >/dev/null 2>&1 &
          pid=$!
          sleep 3
          kill $pid 2>/dev/null || true
          for f in Quicksand-Medium.ttf JetBrainsMono-Regular.ttf; do
            test -s "$fake/.stride/fonts/$f" || { echo "::error::launcher did not seed $f"; exit 1; }
          done
          printf 'x' > "$fake/.stride/fonts/Quicksand-Medium.ttf"
          HOME="$fake" ./stage/stride-app/stride-app >/dev/null 2>&1 &
          pid=$!
          sleep 3
          kill $pid 2>/dev/null || true
          [ "$(wc -c < "$fake/.stride/fonts/Quicksand-Medium.ttf")" -gt 1000 ] || { echo "::error::a corrupt font was not repaired"; exit 1; }
          rm -rf "$fake"

      - uses: actions/upload-artifact@v7
        with:
          name: stride-app-linux-x86_64
          path: stride-app-linux-x86_64.tar.gz
          if-no-files-found: error

  upload:
    name: attach binaries to the release
    needs: [release-please, build, build-viz, build-viz-linux]
    # ENABLED with `build` above. `always()` so it still attaches whatever DID build even if some
    # target failed (fail-fast is off) — a partial binary set beats none.
    # always() fires on cancellation too; !cancelled() keeps a partial set
    # attaching on FAILURE without attaching one to a cancelled run
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums + attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          cd dist
          ls stride-* >/dev/null 2>&1 || { echo "::error::nothing built — nothing to attach"; exit 1; }
          ls stride-cli-* >/dev/null 2>&1 || { echo "::error::no CLI binaries built"; exit 1; }
          # the CLI binaries satisfy stride-* alone, so a missing app zip
          # would pass unnoticed
          for z in stride-app-macos-arm64.zip stride-app-macos-x86_64.zip stride-app-linux-x86_64.tar.gz; do
            [ -f "$z" ] || echo "::warning::$z is missing from this release - its build job failed"
          done
          sha256sum stride-* > SHA256SUMS.txt
          gh release upload "$TAG" stride-* SHA256SUMS.txt \
            --repo "${{ github.repository }}" --clobber
