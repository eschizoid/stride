name: release-please

# Automated releases. release-please watches Conventional Commits on main
# (feat:/fix:/…), maintains CHANGELOG.md and the version in main.roc, and opens a
# "release PR". Merging that PR tags vX.Y.Z + creates the GitHub release.
#
# NOTE: binary build/upload jobs are ENABLED on the new (Zig) compiler, pinned nightly,
# --opt=dev (chosen for build time; #32's SIGABRT was fixed by the 2026-08-17 pin). All FIVE
# targets build with fail-fast
# off + upload runs with always(), so a partial binary set attaches even if a target fails.
# Historical caveat, resolved: bug C (sync heap corruption, #105) was a basic-cli host
# double-free, fixed in 0.22.0. "Bug B" (linux Json.to_str) is named only in these
# comments and has no issue behind it; roc-json was dropped for builtin JSON, so the
# label no longer refers to anything. Neither gates this workflow.
on:
  push:
    branches: [main]

permissions:
  contents: write # tags, releases, and the version-bump commit
  pull-requests: write # the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ github.token }}

  build:
    name: build ${{ matrix.target }}
    needs: release-please
    # ENABLED on the new (Zig) compiler at the pinned nightly (bug A fixed),
    # --opt=dev (build time, not correctness — #32 fixed on the 2026-08-17 pin). All five targets, fail-fast off — we want to SEE which
    # platforms build + pass version-check in CI. The bugs this used to hedge against
    # (C: sync heap corruption, #105; B: linux Json.to_str) are gone -- see the header.
    # The version check only runs `--version` (no sync/plan), so a target failing here
    # means the BUILD itself broke (e.g. linux codegen/linker).
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash # git-bash on Windows so the `set -euo pipefail` steps run on every runner
    strategy:
      fail-fast: false # one target failing shouldn't sink the others
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-latest
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            # VERIFIED 2026-08-14 via the dispatch-only verify-arm64 workflow (run
            # 31832832308): this exact flag on this runner class builds a binary that
            # runs and initializes its SQLite db. History: without the explicit target
            # the compiler auto-detects arm64v1musl, which resolves to no usable host,
            # and releases shipped without linux-arm64 (#141). v0.4.0 onward ship all five.
            roc_target: arm64musl
          - target: macos-arm64
            runs-on: macos-latest # Apple Silicon
          - target: macos-x86_64
            runs-on: macos-15-intel # current Intel runner, standard tier (free for public)
          - target: windows-x86_64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }} # the tagged commit

      - name: Install Roc (new compiler)
        uses: ./.github/actions/setup-roc

      - name: Build
        run: |
          set -euo pipefail
          # only linux-arm64 sets roc_target; everywhere else the native default is right
          target_flag=""
          if [ -n "${{ matrix.roc_target }}" ]; then target_flag="--target=${{ matrix.roc_target }}"; fi
          roc build src/main.roc --output="stride-${{ matrix.target }}" --opt=dev $target_flag
          ls -la stride-${{ matrix.target }}* || true
          test -f "stride-${{ matrix.target }}" || test -f "stride-${{ matrix.target }}.exe"

      - name: Verify binary version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          bin="stride-${{ matrix.target }}"; [ -f "$bin" ] || bin="${bin}.exe"
          out=$(./"$bin" --version)
          [ "$out" = "stride ${TAG#v}" ] || { echo "::error::binary says '$out', tag is $TAG"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: stride-${{ matrix.target }}
          path: stride-${{ matrix.target }}*
          if-no-files-found: error

  build-viz:
    name: build the Form Board (${{ matrix.target }})
    needs: release-please
    # The desktop app ships beside the CLI. macOS ONLY for now, deliberately:
    # the bundle IS the deliverable there (Launchpad, Dock icon, fonts inside),
    # and a linux roc-ray binary needs a verified recipe for raylib's X11/GL
    # link deps that nobody has run on these runners yet - a job that might
    # break a release run buys nothing until someone proves it out.
    # The viz pins its OWN roc nightly: roc-ray needs 08-23, the engine 09-04.
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.runs-on }}
    # macOS runners are the slow, flaky class and `upload` now waits on them;
    # without a cap a hung linker holds the release's assets for six hours
    timeout-minutes: 25
    strategy:
      fail-fast: false # one arch failing shouldn't cost the other, or the CLI
      matrix:
        include:
          - target: macos-arm64
            runs-on: macos-latest
          - target: macos-x86_64
            runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Roc (the viz pin, not the engine pin)
        uses: ./.github/actions/setup-roc
        with:
          nightly-tag: nightly-2026-08-23-fb208ba

      - name: Build the .app bundle
        run: |
          set -euo pipefail
          VIZ_APP_DIR="$PWD/stage" bash tools/make-viz-app.sh

      - name: Verify the bundle before it ships
        run: |
          set -euo pipefail
          app="stage/Stride Form Board.app"
          bin="$app/Contents/MacOS/stride-viz"
          # the launcher IS CFBundleExecutable; asserting only the binary
          # leaves the entry point unchecked
          test -x "$app/Contents/MacOS/launcher"
          test -s "$bin" && test -x "$bin"
          # the runner label is the ONLY thing distinguishing these two
          # artifacts; without this the zip's name is an unverified claim
          case "${{ matrix.target }}" in
            macos-arm64)  want=arm64 ;;
            macos-x86_64) want=x86_64 ;;
          esac
          got=$(lipo -archs "$bin")
          [ "$got" = "$want" ] || { echo "::error::${{ matrix.target }} bundle is $got, not $want"; exit 1; }
          # Apple Silicon refuses an unsigned arm64 Mach-O outright
          codesign -dv "$bin" 2>&1 | head -2
          # every face the window loads, non-empty, and none silently dropped
          for f in Quicksand-Medium.ttf JetBrainsMono-Regular.ttf; do
            test -s "$app/Contents/Resources/fonts/$f"
          done
          have=$(ls "$app/Contents/Resources/fonts/"*.ttf | wc -l | tr -d ' ')
          want_n=$(ls assets/fonts/*.ttf | wc -l | tr -d ' ')
          [ "$have" = "$want_n" ] || { echo "::error::bundled $have fonts, assets/fonts has $want_n"; exit 1; }

      - name: Prove the launcher seeds a fresh machine
        run: |
          set -euo pipefail
          # the fonts inside the bundle reach the window through exactly one
          # bridge - the launcher's seeding - and nothing else in CI or in a
          # dev build ever runs it, because a dev's ~/.stride/fonts is already
          # populated by the build itself. This is that path's only test.
          fake="$(mktemp -d)"
          HOME="$fake" "stage/Stride Form Board.app/Contents/MacOS/launcher" >/dev/null 2>&1 &
          pid=$!
          sleep 6
          kill $pid 2>/dev/null || true
          for f in Quicksand-Medium.ttf JetBrainsMono-Regular.ttf; do
            test -s "$fake/.stride/fonts/$f" || { echo "::error::launcher did not seed $f"; exit 1; }
          done
          # a short/corrupt copy must be repaired, not skipped forever
          printf 'x' > "$fake/.stride/fonts/Quicksand-Medium.ttf"
          HOME="$fake" "stage/Stride Form Board.app/Contents/MacOS/launcher" >/dev/null 2>&1 &
          pid=$!
          sleep 6
          kill $pid 2>/dev/null || true
          [ "$(wc -c < "$fake/.stride/fonts/Quicksand-Medium.ttf")" -gt 1000 ] || { echo "::error::a corrupt font was not repaired"; exit 1; }
          rm -rf "$fake"

      - name: Zip it
        run: |
          set -euo pipefail
          cd stage
          # ditto, not zip: it preserves the bundle's resource forks and
          # execute bits, which a plain zip drops and Finder then refuses
          ditto -c -k --sequesterRsrc --keepParent "Stride Form Board.app" \
            "../stride-form-board-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: stride-form-board-${{ matrix.target }}
          path: stride-form-board-${{ matrix.target }}.zip
          if-no-files-found: error

  upload:
    name: attach binaries to the release
    needs: [release-please, build, build-viz]
    # ENABLED with `build` above. `always()` so it still attaches whatever DID build even if some
    # target failed (fail-fast is off) — a partial binary set beats none.
    # !cancelled() rather than always(): a partial binary set still beats none
    # when a target FAILS, but cancelling a release run should actually stop
    # the assets from attaching - always() fires on cancellation too
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums + attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          cd dist
          ls stride-* >/dev/null 2>&1 || { echo "::error::no binaries built — nothing to attach"; exit 1; }
          # the CLI binaries satisfy `stride-*` on their own, so a release
          # missing the app would pass silently - name the gap out loud
          for z in stride-form-board-macos-arm64.zip stride-form-board-macos-x86_64.zip; do
            [ -f "$z" ] || echo "::warning::$z is missing from this release - its build job failed"
          done
          sha256sum stride-* > SHA256SUMS.txt
          gh release upload "$TAG" stride-* SHA256SUMS.txt \
            --repo "${{ github.repository }}" --clobber
