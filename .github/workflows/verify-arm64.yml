# Dispatch-only check that the release's linux-arm64 build command produces a
# binary that runs and initializes its database on the same runner class, without
# cutting a release. Run it after a toolchain or runner change.
name: verify-arm64
on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
      - name: Build with the release workflow's exact target flag
        run: |
          set -euo pipefail
          roc build src/cli/main.roc --output=stride-cli-linux-arm64 --opt=dev --target=arm64musl
          test -f stride-cli-linux-arm64
      - name: Run the binary
        run: |
          set -euo pipefail
          ./stride-cli-linux-arm64 --version
          HOME=$(mktemp -d) ./stride-cli-linux-arm64 init
