name: manual-release

# Manual, dispatch-only release cut — independent of release-please (which drives
# 0.1.1+ automatically). Reads the version from app.roc, tags it, builds the 4
# binaries, and publishes with notes from CHANGELOG.md. Use to (re-)cut a baseline
# like v0.1.0. Do NOT dispatch while release-please has a pending release PR.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        run: |
          set -euo pipefail
          have=$(grep -oE 'version = "stride [0-9]+\.[0-9]+\.[0-9]+"' src/app.roc | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ -n "$have" ] || { echo "::error::no version in src/app.roc"; exit 1; }
          echo "tag=v$have" >> "$GITHUB_OUTPUT"
      - name: Create + push tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — reusing it (rebuilding + attaching binaries)"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    # ENABLED (2026-08-04) on the new (Zig) compiler, Aug-04 nightly, --opt=dev — mirrors
    # release-please.yml's build job. Use this to (re)build the 4 binaries for the current
    # app.roc version on demand (e.g. attach binaries to an already-cut release).
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-latest
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
          - target: macos-arm64
            runs-on: macos-latest
          - target: macos-x86_64
            runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: roc-lang/setup-roc@v0.3.0
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-August-04-1cb06bc
      - name: Build
        run: |
          set -euo pipefail
          roc build src/app.roc --output="stride-${{ matrix.target }}" --opt=dev
          test -f "stride-${{ matrix.target }}"
      - name: Verify binary version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          out=$(./stride-${{ matrix.target }} --version)
          [ "$out" = "stride ${TAG#v}" ] || { echo "::error::binary says '$out', tag is $TAG"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: stride-${{ matrix.target }}
          path: stride-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    # ENABLED (2026-08-04): always() so it attaches whatever DID build even if a target failed.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls stride-* >/dev/null 2>&1 || { echo "::error::no binaries built"; exit 1; }
          sha256sum stride-* > SHA256SUMS.txt
      - uses: taiki-e/install-action@v2
        with:
          tool: parse-changelog
      - name: Extract notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          parse-changelog CHANGELOG.md "${TAG#v}" > notes.md
          test -s notes.md
      - name: Attach binaries (upload to existing release, else create)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG exists — uploading binaries (clobber)"
            gh release upload "$TAG" dist/stride-* dist/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file notes.md dist/stride-* dist/SHA256SUMS.txt
          fi
