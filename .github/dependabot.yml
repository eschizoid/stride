# GitHub Actions only. Dependabot has no Roc ecosystem, so it cannot see the package
# URLs in src/cli/main.roc or the compiler pin, which is an input to setup-roc and not
# an action version. The nightly is bumped by hand, after a test run on the new tag.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      # Gives `ci(deps): bump ...`, a valid Conventional Commit. The ci type
      # produces no release, so an action bump never moves the version.
      prefix: ci
      include: scope
    groups:
      # Routine first-party action bumps share one PR.
      github-official:
        patterns:
          - actions/*
          - github/*
    ignore:
      # setup-roc decides how the compiler is resolved, so a bump could change the
      # default channel or the meaning of the nightly-tag input and move the build off
      # the pinned nightly. It is updated by hand, with the pin checked again.
      - dependency-name: roc-lang/setup-roc
